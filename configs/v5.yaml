# v5 = v4 features, trained with 19% of train S1 ABSENT (orphan records, test-like pool/S1 = 5.75). Same work_dir as v3.
# Paths are relative to this repo root (code/business_entity_resolution) unless absolute.
paths:
  data_dir: ../../student_resource/dataset
  work_dir: ../../work_v3
  output_dir: ../../output_v5

seed: 42

blocking:
  # Tokens appearing in more pool records than this (within one country) are not used as block keys.
  max_df: 500
  # First pass: keep this many top IDF-scored candidates per Source 1 entity.
  top_k: 300
  # Second pass: reranker keeps this many per Source 1 entity (these feed the pair model).
  rerank_k: 50
  s1_chunk: 50000

validation:
  # Train S1 entities are assigned to folds by hash(entity_id) % n_folds.
  n_folds: 2

# learned Indic-script transliteration + field-specific abbreviations
translit: true
